name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze with CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 360

    # Permissions requises pour CodeQL
    permissions:
      actions: read       # Requis pour que l'action checkout fonctionne
      contents: read      # Requis pour que l'action checkout fonctionne
      security-events: write # Requis pour téléverser les résultats SARIF vers l'onglet Sécurité

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ] # 'javascript' couvre aussi TypeScript

    steps:
      # Étape 1 : Cloner le dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape 2 : Initialiser CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Utilise la suite de requêtes "security-extended" pour une analyse plus approfondie
          queries: security-extended 

      # ÉTAPE AJOUTÉE : Installer les dépendances (Nécessaire pour l'analyse JS/TS)
      # Juice Shop utilise npm.
      - name: Install dependencies
        run: npm install

      # ÉTAPE AJOUTÉE : Autobuild
      # CodeQL a besoin de "tracer" le processus de build pour trouver tout le code JS/TS.
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      # Étape 3 : Créer un dossier pour les résultats
      # Cette étape est bonne, mais l'étape d'analyse le fera aussi.
      - name: Prepare results folder
        run: mkdir -p results

      # Étape 4 : Exécuter l’analyse CodeQL
      # Cette action génère un fichier SARIF ET tente de le téléverser
      # vers l'onglet Sécurité de GitHub.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          # Spécifie où sauvegarder le fichier SARIF localement
          output: results

      # Étape 5 : Sauvegarder le rapport SARIF comme artefact
      # Ceci est utile pour le débogage ou l'intégration avec d'autres outils.
      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: results/*.sarif

      # ÉTAPE 6 (MODIFIÉE) : Générer un VRAI rapport HTML à partir du SARIF
      # Utilise une action dédiée pour convertir le fichier SARIF en HTML.
      - name: Generate HTML Report from SARIF
        uses: anchore/sarif-to-html-action@v1.0.10
        if: always()
        with:
          # Le fichier SARIF généré par CodeQL pour JS s'appellera 'javascript.sarif'
          sarif_file: results/javascript.sarif
          # Le fichier HTML de sortie
          output_file: report/codeql-report.html
          # Titre personnalisé pour le rapport
          title: "CodeQL Analysis Report (Juice Shop)"

      # Étape 7 : Sauvegarder le rapport HTML comme artefact
      # Télécharge le rapport HTML généré à l'étape 6.
      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-html-report
          path: report/codeql-report.html