jobs:
  analyze:
    name: CodeQL Analysis (JavaScript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]  # on reste sur JS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Initialiser CodeQL pour JS/TS
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      # ⚙️ IMPORTANT : ne pas forcer le build, laisser CodeQL analyser sans npm build
      - name: Autobuild (recommended)
        uses: github/codeql-action/autobuild@v3

      # Lancer l’analyse CodeQL
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
