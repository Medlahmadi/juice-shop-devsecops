name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze with CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]

    steps:
      #1️⃣ Cloner le dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Initialiser CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # 3️⃣ Créer un dossier pour les résultats
      - name: Prepare results folder
        run: mkdir -p results

      # 4️⃣ Exécuter l’analyse CodeQL
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: results

      # 5️⃣ Convertir le fichier SARIF en HTML (rapport détaillé)
      - name: Convert SARIF to HTML
        if: always()
        run: |
          npm install -g sarif-to-html
          sarif-to-html results/${{ matrix.language }}.sarif --output report/codeql-report.html || true

      # 6️⃣ Sauvegarder le rapport HTML et SARIF comme artefacts
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-reports
          path: |
            results/*.sarif
            report/codeql-report.html
