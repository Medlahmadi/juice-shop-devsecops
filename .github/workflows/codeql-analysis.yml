name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze with CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]

    steps:
      #1️⃣ Cloner le dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Initialiser CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # 3️⃣ Analyser le code
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: results

      # 4️⃣ Générer un rapport HTML simple et visuel
      - name: Generate HTML Report
        run: |
          mkdir -p report
          cat > report/codeql-report.html <<'EOF'
          <!DOCTYPE html>
          <html lang="fr">
          <head>
            <meta charset="UTF-8">
            <title>Rapport CodeQL - OWASP Juice Shop</title>
            <style>
              body { font-family: Arial, sans-serif; background-color: #f6f8fa; margin: 20px; }
              .container { background: white; padding: 30px; border-radius: 10px; max-width: 1000px; margin: auto; }
              h1 { color: #0366d6; }
              p { font-size: 16px; }
              .ok { color: #28a745; font-weight: bold; }
              .warn { color: #d73a49; font-weight: bold; }
              pre { background: #f0f0f0; padding: 10px; border-radius: 5px; }
            </style>
          </head>
          <body>
            <div class="container">
              <h1>Analyse CodeQL - OWASP Juice Shop</h1>
              <p><strong>Status :</strong> <span class="ok">Analyse terminée avec succès ✅</span></p>
              <p>Ce rapport HTML a été généré automatiquement à partir du pipeline GitHub Actions.</p>
              <p>Les résultats détaillés des vulnérabilités sont consultables dans l’onglet
                 <strong>Security → Code Scanning Alerts</strong> de votre dépôt GitHub.</p>
              <hr>
              <h2>Récapitulatif :</h2>
              <ul>
                <li>Langage : JavaScript/TypeScript</li>
                <li>Moteur d’analyse : CodeQL</li>
                <li>Catégories vérifiées : vulnérabilités OWASP (XSS, injections, fuites de données…)</li>
              </ul>
              <hr>
              <p class="warn">⚠️ Pour voir les résultats complets, ouvrez le rapport SARIF depuis GitHub Security.</p>
            </div>
          </body>
          </html>
          EOF

      # 5️⃣ Sauvegarder le rapport comme artefact
      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-report
          path: |
            results/
            report/codeql-report.html
