name: CodeQL Analysis

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze with CodeQL (javascript)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]

    steps:
      # Étape 1 : Récupérer le code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape 2 : Initialiser CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      # Étape 3 : Installer les dépendances sans scripts ni tests
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts || npm install --ignore-scripts

      # Étape 4 : Laisser CodeQL construire automatiquement
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      # Étape 5 : Analyse statique
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

      # Étape 6 : (Optionnel) Générer un rapport HTML
      - name: Convert SARIF to HTML
        run: |
          npm install -g sarif-html
          npx sarif-html codeql-results/javascript.sarif --output results/codeql-report.html || true

      # Étape 7 : Sauvegarder le rapport
      - name: Upload CodeQL Report
        uses: actions/upload-artifact@v4
        with:
          name: codeql-report
          path: results/codeql-report.html
