name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze with CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]

    steps:
      # 1️⃣ Cloner le dépôt
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Initialiser CodeQL
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # 3️⃣ Créer les dossiers de résultats
      - name: Prepare results folder
        run: mkdir -p results report

      # 4️⃣ Exécuter l’analyse CodeQL
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: results

      # 5️⃣ Installer l’outil de conversion SARIF → HTML
      - name: Install sarif-to-html
        run: npm install -g sarif-to-html

      # 6️⃣ Convertir le rapport SARIF en HTML détaillé
      - name: Convert SARIF to HTML
        run: |
          sarif-to-html results/${{ matrix.language }}.sarif --output report/codeql-report.html || true

      # 7️⃣ Sauvegarder les rapports comme artefacts
      - name: Upload CodeQL Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-reports
          path: |
            results/*.sarif
            report/codeql-report.html
