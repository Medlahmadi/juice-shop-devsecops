name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze with CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Prepare results folder
        run: mkdir -p results

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: results/*.sarif

      - name: Generate HTML Report
        if: always()
        run: |
          mkdir -p report
          cat > report/codeql-report.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>CodeQL Analysis Report</title>
              <style>
                  body { font-family: Arial, sans-serif; margin: 20px; background: #f6f8fa; }
                  .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
                  h1 { color: #0366d6; }
                  .success { color: #28a745; font-weight: bold; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>CodeQL Security Analysis Report</h1>
                  <p><strong>Status:</strong> <span class="success">Analysis Completed</span></p>
                  <p>Check GitHub Security tab for detailed results</p>
              </div>
          </body>
          </html>
          HTMLEOF

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-html-report
          path: report/codeql-report.html
