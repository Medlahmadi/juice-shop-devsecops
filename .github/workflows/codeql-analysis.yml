name: CodeQL Analysis

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 0 * * 0'  
jobs:
  analyze:
    name: Analyze with CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ] 
    steps:
      # Étape 1 : Récupérer le code source
      - name: Checkout repository
        uses: actions/checkout@v4

      # Étape 2 : Initialiser CodeQL pour JavaScript
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality  

      # Étape 3 : Installer les dépendances nécessaires à l’analyse
      - name: Install dependencies
        run: |
          npm install
          npm run build || true   # on ignore les erreurs de build non critiques

      # Étape 4 : Lancer l’analyse CodeQL
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          output: results/
          format: sarif

      # Étape 5 (optionnelle) : Générer un rapport HTML pour ton rapport de TP
      - name: Convert SARIF to HTML
        run: |
          npm install -g sarif-html
          npx sarif-html results/javascript.sarif --output results/codeql-report.html

      # Étape 6 : Sauvegarder le rapport comme artifact
      - name: Upload CodeQL Report
        uses: actions/upload-artifact@v4
        with:
          name: codeql-report
          path: results/codeql-report.html
