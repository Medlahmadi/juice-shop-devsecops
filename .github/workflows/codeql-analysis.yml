name: "CodeQL Analysis"

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  analyze:
    name: Analyze with CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'javascript' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      # ❌ SUPPRIMER Autobuild - cause des problèmes avec les tests
      # Pour JavaScript, pas besoin de build
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif
          path: ${{ github.workspace }}/../results/*.sarif

      - name: Generate HTML Report
        if: always()
        run: |
          mkdir -p report
          cat > report/codeql-report.html << 'EOF'
<!DOCTYPE html>
<html>
<head>
    <title>CodeQL Analysis Report</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f6f8fa; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #0366d6; border-bottom: 3px solid #0366d6; padding-bottom: 10px; }
        .info { background: #e1f5fe; padding: 15px; border-left: 4px solid #0366d6; margin: 20px 0; }
        .success { color: #28a745; font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 CodeQL Security Analysis Report</h1>
        <div class="info">
            <p><strong>Report Generated:</strong> $(date)</p>
            <p><strong>Language:</strong> JavaScript/TypeScript</p>
            <p><strong>Status:</strong> <span class="success">✅ Analysis Completed</span></p>
        </div>
        <h2>📊 Results</h2>
        <p>Detailed results are available in:</p>
        <ul>
            <li><strong>GitHub Security Tab</strong> → Code Scanning Alerts</li>
            <li><strong>Artifacts</strong> → codeql-sarif (SARIF format)</li>
        </ul>
        <p><em>Navigate to your repository's Security tab to view all detected vulnerabilities with detailed remediation guidance.</em></p>
    </div>
</body>
</html>
EOF

      - name: Upload HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-html-report
          path: report/codeql-report.html