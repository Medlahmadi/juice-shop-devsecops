name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  devsecops:
    name: Full DevSecOps Pipeline
    runs-on: ubuntu-latest

    steps:
    # --- Étape 1 : Cloner le dépôt ---
    - name: Checkout repository
      uses: actions/checkout@v4

    # --- Étape 2 : Scan de secrets (Talisman) ---
    - name: Install Talisman
      run: |
        wget https://github.com/thoughtworks/talisman/releases/download/v1.30.0/talisman_linux_amd64
        chmod +x talisman_linux_amd64
        sudo mv talisman_linux_amd64 /usr/local/bin/talisman

    - name: Run Talisman scan
      run: talisman --scan .

    # --- Étape 3 : Analyse SAST (CodeQL) ---
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v2
      with:
        languages: javascript

    - name: Run CodeQL analysis
      uses: github/codeql-action/analyze@v2
      with:
        output: codeql-results.sarif

    # --- Étape 4 : Conversion correcte du rapport CodeQL (CORRIGÉE) ---
    - name: Convert CodeQL SARIF report (fixed)
      run: |
        echo "🔄 Conversion du rapport CodeQL en format SARIF standard..."
        npx @microsoft/sarif-multitool convert codeql-results.sarif -t SemmleQL -o codeql-fixed.sarif

    - name: Upload CodeQL results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: codeql-fixed.sarif

    # --- Étape 5 : Audit des dépendances (Snyk) ---
    - name: Install dependencies
      run: npm install

    - name: Run Snyk vulnerability scan
      uses: snyk/actions/node@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: test --json-file-output=snyk-report.json

    # --- Étape 6 : Scan dynamique (OWASP ZAP) ---
    - name: Run OWASP ZAP Baseline Scan
      uses: zaproxy/action-baseline@v0.9.0
      with:
        target: "http://juice-shop.herokuapp.com"
        cmd_options: "-t 10m -r zap_report.html"

    # --- Étape 7 : Scan de conteneur (Trivy) ---
    - name: Install Trivy
      run: |
        sudo apt-get update -y
        wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.54.1_Linux-64bit.deb
        sudo dpkg -i trivy_0.54.1_Linux-64bit.deb

    - name: Run Trivy image scan
      run: trivy image --format json --output trivy-report.json medlahmadi/juice-shop-secure:latest

    # --- Étape 8 : Sauvegarde des rapports ---
    - name: Upload reports as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          codeql-fixed.sarif
          snyk-report.json
          zap_report.html
          trivy-report.json

    # --- Étape 9 : Import automatique dans DefectDojo ---
    - name: Upload results to DefectDojo
      if: ${{ secrets.DEFECTDOJO_API_KEY != '' }}
      env:
        DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
        DEFECTDOJO_API_KEY: ${{ secrets.DEFECTDOJO_API_KEY }}
        DEFECTDOJO_ENGAGEMENT_ID: ${{ secrets.DEFECTDOJO_ENGAGEMENT_ID }}
      run: |
        echo "📤 Envoi des rapports vers DefectDojo..."
        curl -s -X POST "$DEFECTDOJO_URL/api/v2/import-scan/" \
          -H "Authorization: Token $DEFECTDOJO_API_KEY" \
          -F 'scan_type=CodeQL Scan' \
          -F 'file=@codeql-fixed.sarif' \
          -F "engagement=$DEFECTDOJO_ENGAGEMENT_ID"
        curl -s -X POST "$DEFECTDOJO_URL/api/v2/import-scan/" \
          -H "Authorization: Token $DEFECTDOJO_API_KEY" \
          -F 'scan_type=Snyk Scan' \
          -F 'file=@snyk-report.json' \
          -F "engagement=$DEFECTDOJO_ENGAGEMENT_ID"
        curl -s -X POST "$DEFECTDOJO_URL/api/v2/import-scan/" \
          -H "Authorization: Token $DEFECTDOJO_API_KEY" \
          -F 'scan_type=OWASP ZAP Scan' \
          -F 'file=@zap_report.html' \
          -F "engagement=$DEFECTDOJO_ENGAGEMENT_ID"
        curl -s -X POST "$DEFECTDOJO_URL/api/v2/import-scan/" \
          -H "Authorization: Token $DEFECTDOJO_API_KEY" \
          -F 'scan_type=Trivy Scan' \
          -F 'file=@trivy-report.json' \
          -F "engagement=$DEFECTDOJO_ENGAGEMENT_ID"
